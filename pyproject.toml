[project]
name = "physics-rag"
version = "0.1.0"
description = "Local, citation-grounded RAG over a personal corpus of physics LaTeX notes and PDFs"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "chromadb>=1.5",
    "sentence-transformers>=5.0",
    "torch>=2.13",
    "pypdf>=6.0",
    "typer>=0.20",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "rich>=14.0",
]

[project.optional-dependencies]
ui = ["gradio>=6.0"]

[project.scripts]
rag = "physics_rag.cli:app"

[dependency-groups]
dev = ["pytest>=9.0", "pytest-cov>=7.0", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_rag"]

# CPU-only laptop: avoid the multi-GB CUDA torch build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call-valued defaults; that is its documented idiom.
"src/physics_rag/cli.py" = ["B008"]

[tool.ruff.lint.isort]
# tests/fakes.py is imported by test modules via pytest's rootdir sys.path insertion.
known-first-party = ["physics_rag", "fakes"]
