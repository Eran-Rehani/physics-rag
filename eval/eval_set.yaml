# Evaluation set for physics-rag.
#
# The answerable items below are grounded in the 77501 Astrophysics and
# Cosmology reading set currently staged under the private corpus. Citation
# sections are parser section paths, so the harness checks source locations.
#
# The abstention threshold is calibrated from the negative items; it must not
# be treated as a guessed constant.

questions:
  # ---------------- 77501: Astrophysics in a Nutshell ----------------
  - id: blackbody-wien-law
    question: "How does the peak wavelength of blackbody radiation depend on temperature?"
    answerable: true
    expected_files:
      - "Astrophysics in a Nutshell_ Second Edition (In a Nutshell -- Dan Maoz - 2nd ed Princeton University Press.pdf"
    expected_citations:
      - file: "Astrophysics in a Nutshell_ Second Edition (In a Nutshell -- Dan Maoz - 2nd ed Princeton University Press.pdf"
        section: "2 Stars: Basic Observations > 2.1 Review of Blackbody Radiation"
    notes: "77501 Astrophysics and Cosmology; blackbody spectrum and Wien's law."

