name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Parser tests shell out to pdftotext; pypdf reads the outline.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The corpus and the 4.8GB GGUF are private/local, so CI exercises the
      # pipeline through the Protocol seams using deterministic fakes.
      - name: Tests
        run: uv run pytest -q
